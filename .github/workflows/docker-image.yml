name: Vérifications API
on:
  push:
    branches: [main, reprise]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test
      - run: vendor/bin/phpunit
      - run: python3 tests/reprise/startup_test.py
      - run: docker build --target production -f docker/php/Dockerfile -t forge-jdr-api:test .
