services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: forge
      MARIADB_USER: forge
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-forge}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-local-root-only}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    ports:
      - "127.0.0.1:8741:80"
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      COMPOSER_HOME: /tmp/composer
      APACHE_RUN_USER: "#${LOCAL_UID:-1000}"
      APACHE_RUN_GROUP: "#${LOCAL_GID:-1000}"
      DATABASE_URL: mysql://forge:${DATABASE_PASSWORD:-forge}@db:3306/forge?serverVersion=10.11.0-MariaDB&charset=utf8mb4
volumes:
  db-data:
